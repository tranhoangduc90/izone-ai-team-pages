<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://ducizone.ddns.net https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://accounts.google.com; base-uri 'none'; form-action 'self'">
  <title>Xem bài Speaking · Giảng viên</title>
  <link rel="stylesheet" href="./teacher.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">IZONE · DÀNH CHO GIẢNG VIÊN</p>
      <h1>Bài luyện Speaking của học viên</h1>
      <p>Đăng nhập tài khoản Google được cấp quyền cho lớp để xem bài đã nộp.</p>
    </header>
    <p id="notice" role="status" aria-live="polite">Đang kiểm tra liên kết bài nộp…</p>
    <section id="login-panel" class="card" hidden>
      <h2>Đăng nhập giảng viên</h2>
      <div id="google-sign-in"></div>
    </section>
    <section id="receipt-panel" class="card" hidden>
      <div class="toolbar"><h2 id="assignment-title"></h2><button id="logout" type="button">Đăng xuất</button></div>
      <dl id="summary"></dl>
      <div id="parts"></div>
      <h3>Tiến độ xử lý</h3>
      <ul id="processing"></ul>
    </section>
  </main>
  <script src="../term-tests/shared/config.js"></script>
  <script type="module" src="./teacher.js"></script>
</body>
</html>
