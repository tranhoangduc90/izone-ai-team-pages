<body class="cbt-mode cbt-semantic-mode retake-review">
  <div class="substitute-brandbar"><img src="../substitute-shared/izone-logo-color.png" alt="IZONE" width="120" height="44"></div>
  <div id="app">
    <header class="topbar"><h1>Substitute Test 1 · Khóa 56</h1></header>
    <main class="page-shell review-shell">
      <nav class="progress-bar review-progress" aria-label="Tiến độ">
        <span class="progress-step done" id="review-skill">Thi lại</span>
        <span class="progress-step active" aria-current="step">Kết quả</span>
      </nav>
      <section class="panel result-panel" id="resultView">
        <p class="eyebrow">Kết quả cá nhân</p>
        <h2 id="result-student">Đang tải kết quả…</h2>
        <label id="review-name-field" hidden>Họ và tên <select id="review-name"></select></label>
        <p id="result-meta"></p>
        <p id="result-receipt"></p>
        <p id="result-status" role="status" aria-live="polite"></p>
        <button class="button button-secondary" id="result-retry" type="button" hidden>Thử tải lại</button>
        <p><a id="exam-link" hidden>Về trang bài thi</a> <a id="pick-name-link" hidden>Chọn tên để xem kết quả</a></p>
        <div id="review-score"></div>
        <div id="review-details" class="question-details"></div>
        <div id="review-analysis" class="skill-performance-sections"></div>
      </section>
    </main>
  </div>
