<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
  <title>Lớp demo · IZONE</title>
  <link rel="icon" type="image/svg+xml" href="../../shared/izone-favicon.svg?v=20261105">
  <link rel="stylesheet" href="../../speaking-homework/fonts/nunito.css">
  <link rel="stylesheet" href="styles.css?v=20261020-v1">
<script defer src="../../shared/red-focus-glow.js?v=20261102-r1"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="../">IZONE<span>IELTS</span></a><span class="badge">LỚP DEMO</span></header>
    <h1>Thử bài kiểm tra</h1>
    <p class="intro">Chọn khóa và bài để thử dưới tên Học viên demo. Mỗi lần mở hoặc tải lại trang sẽ bắt đầu một lượt mới.</p>
    <section class="panel" aria-labelledby="testHeading">
      <h2 id="testHeading">Chọn bài muốn thử</h2>
      <div class="filters">
        <label>Khóa học<select id="course"><option value="67">Khóa 67</option><option value="56">Khóa 56</option></select></label>
        <label>Bài kiểm tra<select id="test"><option value="term1">Term Test 1</option><option value="term2">Term Test 2</option><option value="mini">Mini Test</option></select></label>
        <label>Thứ tự làm bài<select id="order"><option value="lis_first">Listening trước</option><option value="read_first">Reading trước</option></select></label>
      </div>
      <div class="actions"><a id="openExam" class="button primary">Mở bài thi</a><a id="openPaper" class="button">Mở phiếu đáp án</a><a id="openTeacher" class="text-link">Trang giảng viên</a></div>
    </section>
    <footer><a href="../substitute-test-1-k56-dashboard/">Trang bài kiểm tra khóa 56/67</a><a href="../">Term Test và Mini Test</a></footer>
  </main>
  <script type="module" src="app-fresh-v1.js"></script>
</body>
</html>
