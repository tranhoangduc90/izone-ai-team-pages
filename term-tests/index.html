<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Answer sheet Listening và Reading cho các bài kiểm tra IZONE">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://ducizone.ddns.net https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' https://accounts.google.com; base-uri 'none'; form-action 'self'">
    <title>IZONE Tests</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="shared/styles.css?rev=20260904-landing-google-auth-v1">
  </head>
  <body>
    <main class="landing-shell">
      <section class="panel landing-card">
        <p class="eyebrow">IZONE · IELTS 6–7</p>
        <h1>IELTS Tests</h1>
        <p>Nhập mã lớp để mở đúng danh sách học viên, sau đó chọn bài test.</p>
        <section class="landing-auth" aria-label="Đăng nhập giảng viên">
          <div>
            <strong id="loginBadge">Giảng viên chưa đăng nhập</strong>
            <p id="loginStatus" role="status">Đăng nhập Google để chọn nhanh lớp bạn đang hoặc đã dạy.</p>
          </div>
          <div id="googleSignInButton"></div>
          <button class="button button-secondary landing-logout" id="logoutButton" type="button" hidden>Đăng xuất</button>
        </section>
        <div class="landing-class-field">
          <label id="classCodeLabel" for="classCode">Mã lớp</label>
          <input id="classCode" autocomplete="off" placeholder="Ví dụ: IC2139" maxlength="32">
          <select id="classSelect" aria-labelledby="classCodeLabel" hidden></select>
          <p class="landing-class-help" id="classHelp">Bạn vẫn có thể nhập mã lớp khi chưa đăng nhập.</p>
        </div>
        <div class="landing-actions">
          <button class="button button-primary" data-test="term-test-1-computer-based">Term Test 1 · Computer-based</button>
          <button class="button button-secondary" data-test="term-test-1">Term Test 1 · Answer sheet</button>
          <button class="button button-secondary" data-test="term-test-2-computer-based">Term Test 2 · Computer-based</button>
          <button class="button button-secondary" data-test="term-test-2">Term Test 2 · Answer sheet</button>
          <button class="button button-secondary" data-test="mini-test-lesson-5-computer-based">Mini Test Buổi 5 · Computer-based</button>
          <button class="button button-secondary" data-test="mini-test-lesson-5">Mini Test Buổi 5 · Answer sheet</button>
          <button class="button button-secondary" id="teacherDashboard" type="button">Giảng viên xem kết quả</button>
        </div>
      </section>
    </main>
    <script src="shared/config.js?rev=20260904-landing-google-auth-v1"></script>
    <script type="module" src="shared/landing.js?rev=20260904-landing-google-auth-v1"></script>
  </body>
</html>
