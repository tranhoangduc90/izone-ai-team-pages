<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Audio Term Test 2 · Khóa 56</title>
    <link rel="icon" type="image/svg+xml" href="../../shared/izone-favicon.svg?v=20261105">
    <link rel="stylesheet" href="../k56-audio-shared/styles.css?rev=20260914-k56-audio-volume-v2">
  <link rel="preload" href="../k56-design/assets/SourceSans3-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../k56-design/theme.css?v=20261023-master170-v3">
  <script defer src="../../shared/red-focus-glow.js?v=20261102-r1"></script>
  </head>
  <body data-k56-design>
    <header class="topbar"><span class="k56-brand"><img src="../k56-design/assets/izone-logo-color.png" alt="IZONE · IELTS Chiến lược"></span><span class="k56-product-label">Audio dự phòng · Khóa 56</span></header>
    <main class="audio-shell">
      <p class="eyebrow">Audio Backup · Khóa 56</p>
      <h1 id="audioTitle">Audio Term Test 2</h1>
      <p class="class-label" id="classLabel">Khóa 56</p>
      <p class="status" id="audioStatus" role="status" aria-live="polite">Đang chuẩn bị audio...</p>
      <progress id="audioProgress" max="1" value="0"></progress>
      <span class="progress-text" id="audioProgressText">Đã tải 0%</span>
      <div class="actions">
        <button class="secondary" id="previewAudio" type="button" disabled>THỬ ÂM LƯỢNG TRƯỚC KHI THI</button>
        <button id="playAudio" type="button" disabled>PHÁT AUDIO BÀI THI</button>
      </div>
      <button id="retryAudio" type="button" hidden>Tải lại audio</button>
      <button id="reportAudio" type="button" hidden>Tôi không nghe được</button>
      <p class="notice">Chỉ dùng khi giáo viên hướng dẫn mở audio dự phòng.</p>
      <audio id="previewPlayer" preload="metadata"></audio>
      <audio id="mainPlayer" preload="auto"></audio>
    </main>
    <dialog class="volume-modal" id="volumeModal" aria-labelledby="volumeTitle">
      <h2 id="volumeTitle">Kiểm tra âm lượng</h2>
      <p>Nghe thử ít nhất 10 giây và điều chỉnh âm lượng trước khi phát bài thi.</p>
      <p id="previewStatus" role="status" aria-live="polite"></p>
      <label class="volume-control">Âm lượng
        <input id="audioVolume" type="range" min="0" max="1" step="0.05" value="1">
      </label>
      <div class="modal-actions">
        <button id="replayPreview" type="button">Nghe thử lại</button>
        <button id="confirmVolume" type="button" disabled>Âm lượng phù hợp — Xác nhận</button>
      </div>
    </dialog>
    <script src="audio-config.js?rev=20261110-listening-continuity-v1"></script>
    <script src="../shared/cbt-audio-start-label.js?v=20261109-preview-10s-v1"></script>
    <script src="../shared/exam-journal/public-audio-session.js?v=20261114-v1"></script>
    <script src="../k56-audio-shared/app.js?journalAudio=20261114-v1&amp;rev=20261110-listening-continuity-v1"></script>
    <script src="../k56-design/presentation.js?v=20261023-master170-v3"></script>
  </body>
</html>
