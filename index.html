<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZONE AI Team Pages</title>
  <meta name="description" content="Cổng truy cập các web tĩnh của đội IZONE AI.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071a33;
      color: #14243b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #153b66, #071a33 58%);
    }

    main {
      width: min(760px, 100%);
      padding: clamp(28px, 5vw, 48px);
      border-radius: 24px;
      background: #f7f9fc;
      box-shadow: 0 28px 80px rgb(0 8 23 / 35%);
    }

    p { color: #617086; line-height: 1.6; }

    .eyebrow {
      margin: 0;
      color: #bb1f31;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 7vw, 3.4rem); }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    a {
      display: block;
      min-height: 142px;
      padding: 22px;
      border: 1px solid #dce4ee;
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      border-color: #e52f42;
      box-shadow: 0 12px 28px rgb(20 36 59 / 12%);
      outline: none;
    }

    strong { display: block; margin-bottom: 8px; font-size: 1.15rem; }
    a span { color: #617086; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">IZONE · AI Team</p>
    <h1>Cổng web học tập</h1>
    <p>Chọn đúng nhóm bài để mở Term Test, Mini Test hoặc handout Writing.</p>
    <nav aria-label="Các nhóm web học tập">
      <a href="./term-tests/">
        <strong>Term Test &amp; Mini Test</strong>
        <span>Answer sheet, bài thi computer-based và trang kết quả giáo viên.</span>
      </a>
      <a href="./writing-handouts/">
        <strong>Writing Task 1 &amp; Task 2</strong>
        <span>Handout lập ý, viết bài, nhận phản hồi và xem tiến độ.</span>
      </a>
    </nav>
  </main>
</body>
</html>
