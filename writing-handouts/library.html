    <header class="library-hero">
      <div>
        <p class="eyebrow">IZONE · Dành cho giảng viên</p>
        <h1>Thư viện handout Writing</h1>
        <p>Xem bài, sao chép đúng link học viên và mở dashboard theo từng lớp.</p>
      </div>
    </header>

    <main class="library-shell">
      <section class="panel auth-card" aria-labelledby="auth-title">

          <p class="eyebrow">Speaking Writing chuyên sâu</p>

        </section>

        <section id="handout-list" class="handout-list" aria-label="Danh sách handout theo thời gian"></section>
