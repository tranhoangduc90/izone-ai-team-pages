<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyệt Reading 67 trên máy tính và điện thoại</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;font:14px/1.5 'Segoe UI',sans-serif;color:#152b4e}header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid #cbd2dc;flex-wrap:wrap}header strong{margin-right:auto;font-size:13px}button,a{border:1px solid #b1bdcc;border-radius:6px;padding:7px 12px;background:#fff;color:#152b4e;cursor:pointer;font:inherit;text-decoration:none;font-size:12px}button.on{background:#152b4e;color:white;border-color:#152b4e}main{display:flex;justify-content:center;align-items:flex-start;padding:16px;height:calc(100dvh - 58px);overflow:auto}iframe{height:100%;width:100%;border:1px solid #bdc7d4;background:#fff;border-radius:8px;box-shadow:0 6px 28px #152b4e15}body.phone iframe{width:390px;min-width:390px;height:844px;flex:none;border-radius:22px}body.phone main{height:auto;min-height:calc(100dvh - 58px)}small{font-size:11px;color:#586477}@media(max-width:500px){header{padding:9px 12px;gap:6px}main{padding:8px}body.phone iframe{min-width:0;width:100%;height:calc(100dvh - 110px)}small{display:none}}
</style></head><body><header><strong>Materials to take us beyond concrete</strong><button id="desktop">Máy tính</button><button id="phone">Điện thoại · 390 px</button><a id="full" href="./" target="_blank">Mở toàn màn ↗</a><small id="mode-label"></small></header><main><iframe title="Reading 67" id="preview"></iframe></main><script>
// Chỉ đổi khung xem; mọi thao tác trong iframe vẫn dùng cùng API và identity.
const params=new URLSearchParams(location.search),real=params.get('server')==='1';
const url='./'+(real?'?server=1':'');document.querySelector('#preview').src=url;document.querySelector('#full').href=url;document.querySelector('#mode-label').textContent=real?'Bộ chấm thật · Máy chủ thử cục bộ':'Prototype · Phản hồi mô phỏng';
function mode(phone){document.body.classList.toggle('phone',phone);document.querySelector('#phone').classList.toggle('on',phone);document.querySelector('#desktop').classList.toggle('on',!phone);params.set('device',phone?'phone':'desktop');history.replaceState(null,'','?'+params);}
document.querySelector('#phone').onclick=()=>mode(true);document.querySelector('#desktop').onclick=()=>mode(false);mode(params.get('device')==='phone');
</script></body></html>
